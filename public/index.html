<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Universitaria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">

<body>

    <!-- NAVBAR -->
    <div id="navbarContainer"></div>

    <div class="container mt-5">
        <div class="p-5 bg-light rounded-3">
            <div class="row align-items-center">

                <!-- Colonna sinistra: immagine -->
                <div class="col-md-5 text-center">
                    <img src="/images/biblioteca.jpg" alt="Biblioteca" class="img-fluid rounded shadow">
                </div>

                <!-- Colonna destra: testo -->
                <div class="col-md-7">

                    <h1 class="display-5 fw-bold">Benvenuto nella Biblioteca</h1>

                    <p class="fs-5">

                        Effettua il login per richiedere prestiti
                        e gestire le tue attività.
                    </p>

                    <a href="/pages/catalogo.html" class="btn btn-primary btn-lg">Consulta il catalogo</a>
                </div>
            </div>
        </div>
    </div>
    
    <!-- FOOTER -->

    <footer class="bg-dark text-light mt-5 p-4">
        <div class="container text-center">
            Biblioteca Universitaria © 2026
        </div>

    </footer>
