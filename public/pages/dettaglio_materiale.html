<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dettaglio materiale</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <!-- NAVBAR -->
    </nav>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="../"><i class="bi bi-house me-2"></i>Home</a>
            <div class="ms-auto d-flex align-items-center">
                <span id="utenteLoggato" class="text-light me-3 d-none"></span>
                <button id="logoutButton" class="btn btn-outline-light d-none">Logout</button>
            </div>
        </div>
    </nav>

    <!-- BREADCRUMB -->
    <!--<div class="container mt-3">-->
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item">
                    <a href="/">Home</a>
                </li>
                <li class="breadcrumb-item">
                    <a href="/pages/catalogo.html">
                        Catalogo
                    </a>
                </li>
                <li class="breadcrumb-item active">
                    Dettaglio materiale
                </li>
            </ol>
        </nav>
    <!--</div>-->

    <!-- CONTENUTO -->
    <div class="container mt-4">
        <div class="card shadow">
            <div class="card-body">
                <div class="row">
                    <!-- COPERTINA -->
                    <div class="col-md-3 text-center">
                        <img
                            id="copertina"
                            src="/images/book-placeholder.png"
                            class="img-fluid rounded copertina-libro"
                            alt="Copertina libro">
                    </div>
                    <!-- DATI LIBRO -->
                    <div class="col-md-9">
                        <h2 id="titolo"></h2>
                        <hr>
                        <div class="row mb-2">
                            <div class="col-md-6">
                                <strong>Autore:</strong>
                                <span id="autore"></span>
                            </div>
                            <div class="col-md-6">
                                <strong>Genere:</strong>
                                <span id="genere"></span>
                            </div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-md-6">
                                <strong>Editore:</strong>
                                <span id="editore"></span>
                            </div>
                            <div class="col-md-6">
                                <strong>Anno:</strong>
                                <span id="annoPubblicazione"></span>
                            </div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-md-6">
                                <strong>ISBN:</strong>
                                <span id="isbn"></span>
                            </div>
                            <div class="col-md-6">
                                <strong>Disponibilità:</strong>
                                <span id="disponibilita"></span>
                            </div>
                        </div>
                    </div>
                </div>
                <hr>
                <!-- DESCRIZIONE -->
                <h5>Descrizione</h5>
                <p id="descrizione"></p>
                <hr>
                <!-- AZIONI -->
                <div class="d-flex gap-2">
                    <button id="btnPrestito" class="btn btn-success">Richiedi prestito</button>
                    <a href="/pages/catalogo.html" class="btn btn-secondary">Torna al catalogo</a>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/dettaglio-materiale.js"></script>

</body>

</html>
