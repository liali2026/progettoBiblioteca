<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dettaglio materiale</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <!-- NAVBAR -->
    <div id="navbarContainer"></div>

    <!-- BREADCRUMB -->
    <div id="breadcrumb"></div>

    <!-- CONTENUTO -->
    <div class="container mt-4">
        <h2 id="pageTitle" class="mb-4">Dettaglio materiale</h2>
        <div class="card shadow">
            <div class="card-body">
                <div class="row">
                    <!-- COPERTINA -->
                    <div class="col-md-3 text-center">
                        <img id="copertina" src="/images/book-placeholder.png" class="img-fluid rounded copertina-libro"
                            alt="Copertina libro">
                    </div>
                    <!-- DATI LIBRO -->
                    <div class="col-md-9">
                        <!--<h2 id="titolo"></h2>-->
                        <div class="mb-3">
                            <label for="titolo" class="form-label">
                                <strong>Titolo</strong>
                            </label>
                            <input id="titolo" class="form-control form-control-lg" readonly maxlength="255" required
                                placeholder="Inserisci il titolo">
                        </div>
                        <hr>
                        <div class="row mb-2">
                            <div class="col-md-6">
                                <label for="autore" class="form-label">
                                    <strong>Autore</strong>
                                </label>
                                <input id="autore" class="form-control" readonly maxlength="255" required
                                    placeholder="Inserisci l'autore">
                            </div>
                            <div class="col-md-6">
                                <label for="genere" class="form-label">
                                    <strong>Genere</strong>
                                </label>
                                <!--<input id="genere" class="form-control" readonly placeholder="Inserisci il genere">-->
                                <select id="genere" class="form-select"></select>
                            </div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-md-6">
                                <label for="editore" class="form-label">
                                    <strong>Editore</strong>
                                </label>
                                <input id="editore" class="form-control" readonly maxlength="255" required
                                    placeholder="Inserisci l'editore">
                            </div>
                            <div class="col-md-6">
                                <label for="annoPubblicazione" class="form-label">
                                    <strong>Anno di pubblicazione</strong>
                                </label>
                                <input id="annoPubblicazione" class="form-control" readonly
                                    placeholder="Inserisci l'anno di pubblicazione">
                            </div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-md-6">
                                <label for="isbn" class="form-label">
                                    <strong>ISBN</strong>
                                </label>
                                <input id="isbn" class="form-control" readonly placeholder="Inserisci l'ISBN">
                            </div>
                            <div class="col-md-6">
                                <label for="disponibilita" class="form-label">
                                    <strong>Disponibilità</strong>
                                </label>
                                <input id="disponibilita" class="form-control" readonly
                                    placeholder="Inserisci il numero di copie">
                            </div>
                        </div>
                    </div>
                </div>
                <!-- ESITO DELLA RICHIESTA DEL PRESTITO-->
                <div id="messaggioPagina" class="alert d-none"></div>
                <hr>
                <!-- DESCRIZIONE -->
                <h5>Descrizione</h5>
                <textarea id="descrizione" class="form-control" rows="5" readonly></textarea>
                <hr>
                <!-- AZIONI -->
                <div class="d-flex gap-2">
                    <button id="btnPrestito" class="btn btn-success">
                        Richiedi prestito
                    </button>
                    <button id="btnSalva" class="btn btn-primary d-none">
                        Salva
                    </button>
                    <a href="/pages/catalogo.html" class="btn btn-secondary">Torna al catalogo</a>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="prestitoModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Richiesta prestito</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label"> Libro</label>
                        <input id="modalTitolo" class="form-control" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Autore</label>
                        <input id="modalAutore" class="form-control" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Utente</label>
                        <input id="modalUtente" class="form-control" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Durata prestito</label>
                        <select id="durataPrestito" class="form-select">
                            <option value="1">
                                1 mese
                            </option>
                            <option value="2">
                                2 mesi
                            </option>
                            <option value="3">
                                3 mesi
                            </option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Data inizio</label>
                        <input id="dataInizio" class="form-control" readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Data fine prevista</label>
                        <input id="dataFine" class="form-control" readonly>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Annulla
                    </button>

                    <button id="btnConfermaPrestito" type="button" class="btn btn-success">
                        Conferma prestito
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/dettaglio-materiale.js"></script>

</body>

</html>
