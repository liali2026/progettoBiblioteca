<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <!-- NAVBAR -->
    <div id="navbarContainer"></div>
    <!-- BREADCRUMB -->
    <div id="breadcrumb"></div>

    <!-- CONTENUTO -->
    <div class="container mt-4">
        <h1 class="mb-4">Prestiti</h1>
        <!-- RICERCA -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Ricerca</h5>
                <div class="row">
                    <div class="col-md-3">
                        <input type="text" id="titolo" class="form-control" placeholder="Titolo">
                    </div>
                    <div class="col-md-3">
                        <input type="text" id="autore" class="form-control" placeholder="Autore">
                    </div>
                    <!-- per bibliotecario-->
                    <div class="col-md-3 d-none" id="filtroUtenteContainer">
                        <input type="text" id="utente" class="form-control" placeholder="Utente">
                    </div>
                   <!----> 
                    <div class="col-md-3">
                        <select id="stato" class="form-select">
                            <option value="ALL" selected>
                                TUTTI
                            </option>
                            <option value="ATTIVO">
                                ATTIVO
                            </option>
                            <option value="RESTITUITO">
                                RESTITUITO
                            </option>
                            <option value="SCADUTO">
                                SCADUTO
                            </option>
                        </select>
                        <!--<input type="text" id="stato" class="form-control" placeholder="Stato del prestito">-->
                    </div>
                    <div class="col-md-2 d-flex gap-2">
                        <button id="btnRicerca" class="btn btn-primary w-100">Cerca</button>
                        <button id="btnPulisci" class="btn btn-outline-secondary w-100">Reset</button>

                    </div>
                </div>
            </div>
        </div>

        <!-- TABELLA RISULTATI -->
        <div id="messaggioPagina" class="alert d-none"></div>
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Prestiti</h5>
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>Titolo</th>
                                <th>Autore</th>
                                <th>Genere</th>
                                <th>Data Inizio Prestito</th>
                                <th>Data Prevista Fine Prestito</th>
                                <th>Data Restituzione</th>
                                <th>Stato prestito</th>
                                <th>Azioni</th>
                            </tr>
                        </thead>
                        <tbody id="tabellaPrestiti">
                            <!--popolata via JavaScript-->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/js/prestiti.js"></script

</body>

</html>
