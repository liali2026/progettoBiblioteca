<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <!-- NAVBAR -->
    <div id="navbarContainer"></div>
    <!-- BREADCRUMB -->
    <div id="breadcrumb"></div>

    <!-- CONTENUTO -->
    <div class="container mt-4">
        <h1 class="mb-4">Prestiti e Prenotazioni</h1>
        <!-- RICERCA -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Ricerca</h5>
                <div class="row g-3">
                    <div class="col-md-4">
                        <input type="text" id="titolo" class="form-control" placeholder="Titolo">
                    </div>
                    <div class="col-md-4">
                        <input type="text" id="autore" class="form-control" placeholder="Autore">
                    </div>
                    <!-- per bibliotecario-->
                    <div class="col-md-4 role-bibliotecario d-none">
                        <input type="text" id="utente" class="form-control" placeholder="Utente">
                    </div>
                    <div class="col-md-4">
                        <select id="tipo" class="form-select">
                            <option value="1" selected>
                                PRESTITI
                            </option>
                            <option value="2">
                                PRENOTAZIONI
                            </option>
                            <!--<option value="ALL" >
                                Prestiti e prenotazioni
                            </option>-->
                        </select>
                    </div>
                    <div class="col-md-4">
                        <select id="storico" class="form-select">
                            <option value="ALL" selected>
                                Tutti
                            </option>
                            <option value="0">
                                In corso
                            </option>
                            <option value="1">
                                Storici
                            </option>
                        </select>
                    </div>
                   <!----> 
                    <div class="col-md-4">
                        <select id="stato" class="form-select">
                        </select>
                    </div>
                    <div class="col-12 d-flex justify-content-end gap-2">
                        <button id="btnPulisci" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-counterclockwise"></i>
                            Reset
                        </button>

                        <button id="btnRicerca" class="btn btn-primary">
                            <i class="bi bi-search"></i>
                            Cerca
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- TABELLA RISULTATI -->
        <div id="messaggioPagina" class="alert d-none"></div>
        <div class="card">
            <div class="card-body">
                <h5 id="titoloDettagli" class="card-title">Dettagli</h5>
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead id="testataPrestiti">
                            <!-- popolata via JS-->
                        </thead>
                        <tbody id="tabellaPrestiti">
                            <!--popolata via JavaScript-->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/js/controllers/prestitiController.js"></script>

</body>

</html>
