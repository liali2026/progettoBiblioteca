<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="../"><i class="bi bi-house me-2"></i>Home</a>
            <div class="ms-auto d-flex align-items-center">
                <span id="utenteLoggato" class="text-light me-3 d-none"></span>
                <button id="logoutButton" class="btn btn-outline-light d-none">Logout</button>
            </div>
        </div>
    </nav>

    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item">
                <a href="/">Home</a>
            </li>
            <li class="breadcrumb-item active" aria-current="page">
                Catalogo
            </li>
        </ol>
    </nav>

    <!-- CONTENUTO -->
    <div class="container mt-4">
        <h1 class="mb-4">Catalogo</h1>
        <!-- RICERCA -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Ricerca</h5>
                <div class="row">
                    <!--<div class="col-md-10">
                        <input type="text" id="campoRicerca" class="form-control" placeholder="Titolo o autore">
                    </div>-->
                    <div class="col-md-5">
                        <input type="text" id="titolo" class="form-control" placeholder="Titolo">
                    </div>
                    <div class="col-md-5">
                        <input type="text" id="autore" class="form-control" placeholder="Autore">
                    </div>
                    <div class="col-md-2 d-flex gap-2">

                        <button id="btnRicerca" class="btn btn-primary w-100">Cerca</button>

                        <button id="btnPulisci" class="btn btn-outline-secondary w-100">Reset</button>

                    </div>
                </div>
            </div>
        </div>

        <!-- TABELLA RISULTATI -->
        <div id="messaggioRisultati" class="alert d-none"></div>
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Materiali disponibili</h5>
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>Titolo</th>
                                <th>Autore</th>
                                <th>Genere</th>
                                <th>Disponibilità</th>
                                <th>Azioni</th>
                            </tr>
                        </thead>
                        <tbody id="tabellaMateriali">
                            <!--popolata via JavaScript-->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/catalogo.js"></script>

</body>

</html>
