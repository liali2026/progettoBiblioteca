<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <!-- NAVBAR -->
    <div id="navbarContainer"></div>
    <!-- BREADCRUMB -->
    <div id="breadcrumb"></div>

    <!-- CONTENUTO -->
    <div class="container mt-4">
        <div>
            <h1 class="mb-4">Catalogo</h1>
            <button id="btnNuovoMateriale" class="btn btn-success d-none">
                <i class="bi bi-plus-circle"></i>
                Nuovo materiale
            </button>
        </div>
        <!-- RICERCA -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title mb-3">Ricerca</h5>

                <div class="row g-3">

                    <!-- Prima riga -->
                    <div class="col-md-4">
                        <input type="text" id="titolo" class="form-control" placeholder="Titolo">
                    </div>

                    <div class="col-md-4">
                        <input type="text" id="autore" class="form-control" placeholder="Autore">
                    </div>

                    <div class="col-md-4">
                        <input type="text" id="isbn" class="form-control" placeholder="ISBN">
                    </div>

                    <!-- Seconda riga -->
                    <div class="col-md-4">
                        <input type="number" id="anno" class="form-control" placeholder="Anno di pubblicazione">
                    </div>

                    <div class="col-md-4">
                        <select id="genere" class="form-select">
                            <!-- OPTION CARICATE TRAMITE JS -->
                        </select>
                    </div>

                    <!--<div class="col-md-4 d-flex align-items-center">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="soloDisponibili">

                            <label class="form-check-label" for="soloDisponibili">
                                Solo materiali con copie disponibili
                            </label>
                        </div>
                    </div>-->
                    <div class="col-md-4 d-flex align-items-center">
                        <select id="soloDisponibili" class="form-select">
                            <option value="ALL" selected>
                                Qualsiasi disponibilità
                            </option>
                            <option value="0">
                                Nessuna copia
                            </option>
                            <option value="1">
                                Solo disponibili
                            </option>
                        </select>
                    </div>
                    <!-- Terza riga: pulsanti -->
                    <div class="col-12 d-flex justify-content-end gap-2">
                        <button id="btnPulisci" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-counterclockwise"></i>
                            Reset
                        </button>

                        <button id="btnRicerca" class="btn btn-primary">
                            <i class="bi bi-search"></i>
                            Cerca
                        </button>
                    </div>

                </div>
            </div>
        </div>

        <!-- TABELLA RISULTATI -->
        <div id="messaggioPagina" class="alert d-none"></div>
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Materiali disponibili</h5>
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>Titolo</th>
                                <th>Autore</th>
                                <th>Genere</th>
                                <th>Anno di pubblicazione</th>
                                <th>ISBN</th>
                                <th>Disponibilità</th>
                                <th>Azioni</th>
                            </tr>
                        </thead>
                        <tbody id="tabellaMateriali">
                            <!--popolata via JavaScript-->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/js/controllers/catalogoController.js"></script>

</body>

</html>
