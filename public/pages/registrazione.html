<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>Registrazione</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    Registrazione
                </div>
                <div class="card-body">
                    <form id="registerForm">
                        <input type="text" id="nome" class="form-control mb-3" placeholder="Nome" required>
                        <input type="text" id="cognome" class="form-control mb-3" placeholder="Cognome" required>
                        <input type="email" id="email" class="form-control mb-3" placeholder="Email" required>
                        <input type="password" id="password" class="form-control mb-3" placeholder="Password" required>
                        <!-- di default il front end inserirà sempre e solo utenti-->
                        <!--<select id="ruolo" class="form-select" required>
                            <option value="">Seleziona un ruolo</option>
                            <option value="UTENTE">Utente</option>
                            <option value="BIBLIOTECARIO">Bibliotecario</option>
                        </select>-->

                        <button type="submit" class="btn btn-success w-100">Registrati</button>
                    </form>

                    <div
                        id="messaggio" class="mt-3">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!--<script src="/js/registrazione.js"></script>-->
<script src="/js/controllers/registrazioneController.js"></script>

</body>
</html>
